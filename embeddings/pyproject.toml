[project]
name = "indic-edge-embeddings"
version = "0.1.0"
description = "Compact Indic embedding models for client-side and browser inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "sentencepiece>=0.2.0",
    "indic-transliteration>=2.3.0",
    "pyarrow>=14.0.0",
    "onnxscript>=0.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "kaggle>=1.6.0",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py310"]
